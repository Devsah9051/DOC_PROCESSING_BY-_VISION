pipeline_version: "1.0.0"
rules_version: "1.0.0"

# intake
dpi: 150
max_bytes: 10000000
max_pages: 10
max_pixels: 50000000

# archive bomb detection (DOCX is a ZIP)
max_compression_ratio: 100
max_zip_entries: 10000
max_pdf_objects: 100000

# malware scanner
scan_enabled: false
scan_engine: "yara+cdr"
scan_poll_interval: 5  # DEPRECATED: scanner runs synchronously in Stage 1
scan_max_attempts: 5   # DEPRECATED: scanner runs synchronously in Stage 1

# CDR reconstruction
cdr_dpi: 200
cdr_reconstruct_pdf: true
cdr_reconstruct_docx: true

# verify
contrast_min: 1.5
min_ink: 0.02
ghost_diff_threshold: 40
ocr_margin: 4
iou_threshold: 0.30
fuzzy_threshold: 85
tiny_font_max_pt: 6.0

# severity weights (added to weighted score)
weights:
  injection_strong: 10.0
  injection_weak: 1.0
  hidden_text: 8.0
  low_contrast: 2.0
  tiny_font: 3.0
  off_page: 3.0
  covered_clipped: 4.0
  zero_width: 3.0
  mixed_script: 2.0
  private_use: 4.0
  garbled: 3.0
  font_anomaly: 3.0
  mismatch: 4.0
  link_mismatch: 3.0
  not_visible: 8.0

# thresholds
suspicious_score: 5.0
review_threshold: 2.0
quarantine_threshold: 5.0
# strong injection => QUARANTINED directly, regardless of score

# audit
audit_rate: 0.05

# injection scan patterns (3.9)
injection:
  strong:
    - "ignore\\s+(all\\s+)?previous\\s+(instructions|directions)"
    - "disregard\\s+(all\\s+)?previous"
    - "system\\s*:\\s*you\\s+are"
    - "reveal\\s+your\\s+system\\s+prompt"
    - "print\\s+the\\s+system\\s+prompt"
  weak:
    - "http://"
    - "mailto:"
    - "file://"
